name: Deploy to Cloudflare

# Runs on every push to main, and can be triggered by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only checkout: this workflow never writes back to the repo.
permissions:
  contents: read

concurrency:
  # If two pushes land close together, let the newer one win rather than
  # deploying them out of order.
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installs exactly what package-lock.json pins, so a build here
      # matches the build that was tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      # Fail loudly here rather than silently deploying an empty directory.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing — build produced no homepage"; exit 1; }
          echo "Built $(find dist -name '*.html' | wc -l) HTML pages"

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Tells IndexNow-participating search engines (Bing, Yandex and others)
      # that every page may have changed, right after it actually goes live.
      # The key file it points at lives at public/<key>.txt, deployed above.
      # Non-fatal: a failed or slow ping here should never fail the deploy.
      - name: Notify search engines via IndexNow
        continue-on-error: true
        run: |
          KEY="0063205f8dbd9d3a2183945d6157939e"
          HOST="rentatvsantateresa.com"
          URLS=$(grep -oE '<loc>[^<]+</loc>' dist/sitemap-0.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -s .)
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URLS}"
